# Lines of business, their core rows, and known extra coverages.
# - core:   always shown in the table, in this order. Row names come from the broker's current tool.
# - extras: known optional coverages. Shown under "Also compare" when any quote marks them important,
#           otherwise under "Other coverages on these quotes". Anything not listed here is extracted as key "other" with the document's label.
# - desc:   tells the LLM what belongs under this key, including common carrier wording.
# - per_vehicle: value can differ per vehicle.
# - multiple: the key may appear several times in one quote without a vehicle (one item per category).
# - better: (display only) higher | lower. Which way is better for a dollar amount in this row: marks
#           the best value and draws bars in the broker's table. Omit it when neither is simply better.
# - help:   (display only) one plain-English line under the row name on the client PDF.
# Bump config_version whenever you edit label, desc, per_vehicle, multiple, note, or anything under
# notice_keys (cached extractions re-run, which costs API calls). Changes to better, help, or show
# alone need no bump: the model never sees them.

config_version: "7"

notice_keys:
  # desc: tells the LLM what to record.  show: the sentence the app shows under "Good to know" (null = not shown there).
  estimated_premium:
    desc: "The document says the price is an estimate, preliminary, or depends on something not yet run (e.g. credit or financial responsibility score)."
    show: "Price is an estimate."
  quote_expiration:
    desc: "The date the quote expires or how long it is valid."
    show: "Quote expires: {text}"
  policy_period:
    desc: "Proposed effective and expiration dates."
    show: null
  uninsured_motorist_rejected:
    desc: "UM or UIM coverage is shown as rejected or declined."
    show: "Uninsured motorist coverage is marked rejected."
  underlying_auto_bi:
    desc: "Umbrella quotes only: the auto bodily injury limits the umbrella requires (e.g. $300,000/$500,000). Copy the value exactly."
    show: "Requires auto liability of {text}."
  underlying_auto_pd:
    desc: "Umbrella quotes only: the auto property damage limit the umbrella requires."
    show: "Requires auto property damage of {text}."
  underlying_home_liability:
    desc: "Umbrella quotes only: the home personal liability limit the umbrella requires."
    show: "Requires home liability of {text}."
  discounts:
    desc: "The list of discounts applied, as one line of text. Note any multi-policy / bundle discount."
    show: null
  surcharge_or_history:
    desc: "Accidents, violations, or claims listed that affect the price."
    show: "Accident or violation listed."
  other_notice:
    desc: "Anything else a broker should see before recommending: exclusions of note, flood not covered, roof settlement terms, conditions."
    show: null      # free text: shown in the quote dialog, not under "Good to know"
  # Added by code, not by the LLM:
  no_pay_in_full:
    desc: null
    show: "No pay-in-full price shown. This is the stated total."
  below_umbrella_requirement:
    desc: null
    show: "Liability is below what the {carrier} umbrella requires."
  sum_mismatch:
    desc: null
    show: "{text}"  # shown only while the price is marked for checking
  monthly_only:
    desc: null
    show: "Only a monthly premium is shown."

